name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  exact-and-installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/test_engine.cjs
      - run: python tools/check_assets.py
      - run: python tools/check_installed.py
  independent-integer-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reference.txt
      - run: python tools/check_milp.py
  actual-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: node --test tests/test_browser.cjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
