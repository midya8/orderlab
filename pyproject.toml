[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "orderlab-finite"
version = "0.1.0"
description = "Exact finite rank aggregation with independent evidence replay"
requires-python = ">=3.10"
license = {text="MIT"}
[project.scripts]
orderlab = "orderlab.__main__:main"
[tool.setuptools]
packages = ["orderlab"]
